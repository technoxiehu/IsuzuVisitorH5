

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: info
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: @spring.profiles.active@
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # 邮件配置（访客审批邮件，占位：SMTP 信息确定后取消注释；未配置时系统正常启动，邮件发送跳过并记录日志）
  mail:
    host: smtp.qiye.163.com
    port: 465
    username: ggyxfw@jx-isuzuengine.com 
    password: Isuzu0791
    # 显式 UTF-8（Spring Boot 4 默认即为 UTF-8，此处防配置漂移）
    default-encoding: UTF-8
    properties:
      mail:
        from: 公共邮箱服务
        smtp:
          auth: true
          ssl:
            enable: true
  data:
    # redis 配置
    redis:
      # 地址
      host: ay.jxjkx.com
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password: a12bCd3_W45pUq6
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
        # 开启客户端心跳，维持连接不空闲
        client-options:
          ping-interval: 30000  # 每30s发一次PING心跳，避免空闲被断开

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30



# 访客审批 token 配置（与登录 token 体系解耦，见 docs/03_接口契约.md §5.1）
approve:
  # 审批 JWT 签名密钥（HS512）。注意：jjwt 0.9.x 将字符串密钥按 Base64 解码为字节使用，
  # 此处必须为标准 Base64 编码（明文为 IsuzuVisitorApproveSecret）
  secret: SXN1enVWaXNpdG9yQXBwcm92ZVNlY3JldA==
  # 审批 token 有效期（默认7天，分钟）
  expireTime: 10080

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
